<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register - SCADA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> body { background: linear-gradient(135deg, #232526 0%, #414345 100%); height: 100vh; display: flex; align-items: center; justify-content: center; } .card { border-radius: 15px; } </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <h3 class="text-center text-success mb-4">📝 Add New User</h3>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}{% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}{% endif %}
                    {% endwith %}
                    <form method="POST">
                        <div class="mb-3">
                            <label>New Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>New Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Register</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('login') }}">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
